name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: unit — Supabase 不要な高速フィードバック
  # ─────────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # Job 2: integration — DB 依存テスト全体（Supabase 起動 1回）
  # migrate + e2e を統合し Supabase 二重起動を排除
  # ─────────────────────────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps chromium
      - name: Start local Supabase
        # supabase@2.84.2 の exclude 名はハイフン区切り（旧名 inbucket/storage/edge_runtime は無効で余分な pull が発生する）
        # ECR toomanyrequests 対策でリトライする
        run: |
          set -euo pipefail
          EXCLUDE='studio,imgproxy,mailpit,logflare,vector,storage-api,edge-runtime'
          for attempt in 1 2 3 4 5; do
            if npx supabase@2.84.2 start --exclude "$EXCLUDE"; then
              exit 0
            fi
            echo "supabase start failed (attempt ${attempt}/5); sleeping before retry..."
            sleep $((attempt * 20))
          done
          echo "supabase start failed after retries" >&2
          exit 1
      - name: Run migrations
        run: npx supabase@2.84.2 db push --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: npm run test:integration
      - name: Run Node.js E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: npm run test:e2e
      - name: Run Playwright browser E2E tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=list,html
        timeout-minutes: 10
      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
